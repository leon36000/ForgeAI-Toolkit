# Généré par ForgeAI Toolkit — plan np (profil minimal-cpu)
apiVersion: v1
kind: Namespace
metadata:
  name: np-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.25
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.25
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.25
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeai-sa
  namespace: np-lab
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgeai-default-deny
  namespace: np-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgeai-allow-dns
  namespace: np-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgeai-allow-redis
  namespace: np-lab
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litellm
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgeai-allow-litellm-egress
  namespace: np-lab
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: np-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      serviceAccountName: forgeai-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: inscriptible-tmp
              mountPath: /tmp
      volumes:
        - name: inscriptible-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: np-lab
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: np-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      serviceAccountName: forgeai-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: busybox:latest
          ports:
            - containerPort: 4000
          args:
            - "sleep"
            - "900"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: inscriptible-tmp
              mountPath: /tmp
      volumes:
        - name: inscriptible-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: np-lab
spec:
  type: NodePort
  selector: {app: litellm}
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 31856
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isole
  namespace: np-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: isole}
  template:
    metadata:
      labels: {app: isole}
    spec:
      serviceAccountName: forgeai-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: isole
          image: busybox:latest
          ports:
            - containerPort: 9999
          args:
            - "sleep"
            - "900"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: inscriptible-tmp
              mountPath: /tmp
      volumes:
        - name: inscriptible-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: isole
  namespace: np-lab
spec:
  type: NodePort
  selector: {app: isole}
  ports:
    - port: 9999
      targetPort: 9999
      nodePort: 32319

