[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai-toolkit"
version = "0.1.0"
description = "Déployeur de référence d'infrastructures IA agentiques — wizard hardware-aware, catalogue bilingue, multi-nœuds, gouvernance intégrée"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Aucune dépendance runtime : le cœur tourne sur la bibliothèque standard uniquement,
# pour une portabilité maximale (pip install sans chaîne de dépendances).
dependencies = []

[project.optional-dependencies]
# (extra [tui] retiré — pivot acté : l'interface v1 est la web-app stdlib `forgeai web`, cf. CANON/spec-web-ui.md)
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6", "types-pyyaml>=6", "ruff>=0.5", "mypy>=1.10", "ggshield>=1.52", "pre-commit>=3.2"]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forgeai.data" = ["*.json", "*.sha256", "locales/*.json", "stacks/*.json", "smoke/*.md"]
"forgeai.web" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
