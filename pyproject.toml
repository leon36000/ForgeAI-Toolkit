[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai-toolkit"
version = "0.1.0"
description = "Déployeur de référence d'infrastructures IA agentiques — wizard hardware-aware, catalogue bilingue, multi-nœuds, gouvernance intégrée"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Aucune dépendance runtime : le cœur tourne sur la bibliothèque standard uniquement,
# pour une portabilité maximale (pip install sans chaîne de dépendances).
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.60"]          # wizard interactif (le mode --ci n'en a pas besoin)
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forgeai.data" = ["*.json", "*.sha256", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts"]
