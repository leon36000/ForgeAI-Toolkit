# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  # RC1-014 (#444) : exclusions bornées aux artefacts GÉNÉRÉS ayant leur propre validation
  # déterministe séparée (gate CI dédié) — CANON/, Docs/, stories/ retirés de l'exclusion :
  # contenu normatif majoritairement humain, doit désormais recevoir la revue automatique.
  # Vérifié : scripts/governance/validate_coderabbit_config.py (aucun chemin mort, exclusions
  # bornées à une allowlist justifiée).
  path_filters:
    - "!src/forgeai/data/**"
    - "src/forgeai/data/__init__.py"
    - "!archive/**"
    - "!evidence/registres/**"
    - "!evidence/reviews/**"
    - "!evidence/audit-output/**"
    - "!evidence/dedup/**"
    - "!governance/STATE-CURRENT.json"
    - "!governance/STATE-CURRENT.md"
    - "!governance/path-classification.json"
    - "!governance/PATH-CLASSIFICATION.md"
    - "!governance/AUTHORITY-MAP.md"
    - "!build/**"
    - "!dist/**"
  pre_merge_checks:
    docstrings: { mode: "warning" }
    title: { mode: "warning" }
    description: { mode: "warning" }
    issue_assessment: { mode: "warning" }

chat:
  auto_reply: true
