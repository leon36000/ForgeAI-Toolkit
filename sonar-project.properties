sonar.projectKey=leon36000_ForgeAI-Toolkit
sonar.organization=leon36000

sonar.sources=src,scripts
sonar.tests=tests
# scripts/proof/** exclus de l'ANALYSE : scripts de preuve e2e (déploiement Docker réel + assertions),
# outillage de confiance exécuté manuellement, PAS du code de bibliothèque livré — leurs subprocess /
# urllib http locale sont inhérents à la preuve (pas une surface d'attaque du produit).
sonar.exclusions=**/__pycache__/**,**/*.pyc,src/forgeai/data/**,scripts/proof/**
sonar.test.exclusions=**/__pycache__/**,**/*.pyc

# Risque ACCEPTÉ & DOCUMENTÉ (validé par revue scellée 3/3, S5/S6) — S2612 permissions de fichier :
# le conteneur openbao-unsealer tourne sous l'UID NON-root de l'image officielle (≠ opérateur) et lit
# la clé d'unseal via un bind-mount hôte → le répertoire doit être traversable (0o711) et la clé lisible
# (0o644) par ce conteneur. La clé d'unseal est co-localisée avec le storage scellé sur le MÊME hôte
# (frontière de confiance identique : qui lit l'hôte a déjà les deux) et le ROOT token reste 0o600 ISOLÉ
# hors du volume de l'unsealer. Le contrôle réel = l'accès au nœud (documenté, frontière T3).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2612
sonar.issue.ignore.multicriteria.e1.resourceKey=src/forgeai/deploy/openbao_flow.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Les assets navigateur (JS/HTML/CSS) sont analysés pour la qualité mais PAS comptés dans la
# couverture : aucun runner JS n'est câblé aux gates (le produit est stdlib pur). Leur logique
# pure est prouvée hors couverture par tests/js/*.test.cjs (Node) et leur rendu se vérifie en
# navigateur. Sans cette exclusion, les lignes JS neuves comptent comme non couvertes et font
# chuter « coverage on new code » sous 80 % (S6b).
# scripts/proof/** : scripts de PREUVE e2e (ex. prove_ubuntu_vierge, prove_openbao_prod) — ce SONT
# les preuves exécutées (déploiement Docker réel), pas du code de bibliothèque unit-testable. Ils
# sont exécutés RÉELLEMENT et leur sortie est journalisée au registre / EVIDENCE ; les compter en
# couverture ferait chuter « coverage on new code » sous 80 % alors qu'ils sont eux-mêmes la preuve.
# scripts/check_metering_sites.py (B-20b) : lanceur CLI MINCE (sys.path + appel de main()). La
# LOGIQUE vit dans forgeai.models.metering_guard, couverte à 100 % par tests/test_metering_guard.py
# (mesurée par --cov=src/forgeai). Le wrapper lui-même n'est que de la plomberie d'entrée.
sonar.coverage.exclusions=src/forgeai/web/assets/**,scripts/proof/**,scripts/check_metering_sites.py
