    contrainte: "subagent model: crew-coder-bulk ; doc_keeper.py ; jamais codeur lorsqu'il agit comme sentinelle ; la sentinelle peut rouvrir une story"

  # Terra Pro cumule deux rôles : codeur TUI/UX/parallèle ET reviewer aveugle scellé.
  # Règle explicite : il ne doit JAMAIS reviewer une story qu'il a codée.
  - id: terra
    modele: ChatGPT Terra Pro 5.6
