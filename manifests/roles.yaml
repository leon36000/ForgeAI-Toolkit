    modele: Modèle actif Claude Code
    vendor: anthropic
    provider_id: null
    phase_a: Orchestrateur — revue et validation des travaux structurels
    phase_b: Orchestrateur — code le plus dur et signe sur pièces
    contrainte: session lead ; ne se relit jamais lui-même — reviewers non-Anthropic obligatoires sur son code

  - id: kimi_k3
    modele: Kimi K3
    vendor: moonshot
    provider_id: Kimi-K3
    phase_a: Architecte — revue AVANT code structurel
    phase_b: Codeur très haute difficulté hors Orchestrateur ; codeur TUI/UX et parallèle
    contrainte: "dispatch --difficulty difficile pour les missions structurelles et de très haute difficulté"

  - id: opus_5
    modele: Opus 5
    vendor: anthropic
    provider_id: null
    phase_a: Codeur très haute difficulté hors Orchestrateur
    phase_b: Codeur très haute difficulté via subagent natif
    contrainte: subagent general-purpose natif Claude Code ; pas de route bridge

  - id: muse
    modele: Muse Spark 1.2
    vendor: meta
    provider_id: Muse-Spark-1.2
    phase_a: Codeur des missions longues multi-fichiers
    phase_b: Codeur des missions longues multi-fichiers
    contrainte: "subagent model: crew-coder-long"

  - id: gemini_flash
    modele: Gemini 3.7 Flash
    vendor: google
    provider_id: Gemini-3.7-Flash
