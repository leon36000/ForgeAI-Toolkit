name: gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-fs-multi-os:
    # Le critere d'arret de l'ADR B-24 (amendement du tour 11) exige que la matrice de
    # comportement de la garde passe sur les TROIS OS supportes. La garde et le verrou
    # portable (ADR #286, fcntl/msvcrt) sont les deux composants du produit dont le
    # comportement depend de l'OS : separateur de chemin et lettres de lecteur Windows
    # pour la garde ; selection de backend flock/LockFile selon os.name pour le verrou.
    # Une preuve Linux seule ne vaut donc rien pour ces composants, alors qu'elle
    # suffit pour le reste du depot — d'ou une matrice ciblee sur ces fichiers de
    # tests plutot qu'un doublement de toute la CI.
    #
    # SECRET-020C etend la matrice a l'IMPORT de src/forgeai/deploy/openbao_flow.py : son
    # import conditionnel de grp (POSIX-only, herite de PORT-286) est un troisieme
    # comportement dependant de l'OS. test_openbao_flow_import.py fait un import PUR (stdlib
    # seul, sans tirer yaml ni la chaine deploy complete de test_openbao_flow.py) et prouve
    # la portabilite reelle sur les trois OS, la ou le mock Linux ne le pouvait pas.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Garde de confinement filesystem — matrice de comportement
        run: python -m pytest tests/test_guard_fs.py tests/test_portable_lock.py tests/test_registre_concurrence.py tests/test_openbao_flow_import.py -q

  no-stub-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gate §8bis — zéro stub, zéro faux
        run: python3 scripts/no_stub_scan.py --all

  registres:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 est REQUIS par le gate d'ancrage : la référence anti-rollback est l'état
      # DÉJÀ MERGÉ (origin/main), qu'une PR ne peut pas réécrire. Avec la profondeur 1 par
      # défaut l'historique serait absent et le contrôle échouerait — volontairement, plutôt que
      # de verdir en silence (REG-029B). Même motif que le job gitleaks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Intégrité des chaînes de hash
        run: python3 scripts/registre.py verify evidence/registres/*.jsonl
      # `verify` prouve l'intégrité, jamais l'absence de manque : une chaîne tronquée reste
      # parfaitement valide (ADR-TRUST-019A §2.3, lignes 64-71). L'ancrage compare chaque
      # registre à origin/main et détecte troncature, rollback et réécriture totale cohérente.
      - name: Ancrage — rollback, troncature, réécriture (REG-029B)
        run: python3 scripts/registre.py ancrage --dossier evidence/registres --ref origin/main
      # Cliquet de complétude : la dette héritée (31 anomalies, bornées à seq_max) est figée dans
      # une base versionnée ; toute anomalie NOUVELLE fait rougir. La base ne peut pas être
      # élargie pour faire passer une PR : au-delà de la borne, aucune identité n'est baselinable.
      - name: Complétude — cliquet sur la dette héritée (REG-029A/B)
        run: |
          python3 scripts/registre.py completude evidence/registres/*.jsonl \
            --base evidence/registres/BASELINE-COMPLETUDE.json \
            --base-ref-git origin/main
      # governance/vision-log.jsonl (RC1-001/#431) réutilise le même format et les mêmes
      # garanties que evidence/registres/mission.jsonl — même chaîne verify + ancrage, dossier
      # différent.
      - name: Journal de vision (governance) — intégrité + ancrage
        run: |
          python3 scripts/registre.py verify governance/vision-log.jsonl
          python3 scripts/registre.py ancrage --dossier governance --ref origin/main

  authority-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Gate RC1-001 (#431) — hiérarchie d'autorité : inventaire, cycles, conflits, empreintes"
        run: python3 scripts/governance/validate_authority.py

  state-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Gate RC1-007 (#437) — état courant : dérive des compteurs générés"
        run: python3 scripts/governance/state_current.py --docs README.md --docs AGENTS.md

  path-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Gate RC1-008 (#438) — classification des chemins : dérive de l'inventaire"
        run: python3 scripts/governance/classify_paths.py

  docs:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 : la non-croissance de la base est vérifiée contre l'état DÉJÀ MERGÉ.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Mesuré avant ce gate : 5 sous-commandes documentées sur 21. Un gate exigeant tout serait
      # rouge au premier jour puis désactivé ; la dette est donc figée dans une base BORNÉE —
      # toute commande ajoutée depuis doit être documentée, jamais baselinée.
      - name: Gate DOC-032 — aucune commande CLI ajoutée sans documentation
        run: |
          python3 scripts/gate_docs.py \
            --base Docs/BASELINE-CLI-DOC.json \
            --base-ref-git origin/main

  mypy-ratchet:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 : la non-croissance de la base est vérifiée contre l'état DÉJÀ MERGÉ.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      # Mesuré à la création du gate (#449) : 134 erreurs / 12 fichiers, 74 fichiers déjà propres
      # protégés à zéro tolérance. La dette est gelée dans une base BORNÉE — toute régression doit
      # être corrigée, jamais re-baselinée.
      - name: Gate RC1-019 — cliquet mypy (aucune régression, dette non extensible)
        run: |
          python3 scripts/mypy_gate.py \
            --base Docs/BASELINE-MYPY.json \
            --base-ref-git origin/main

  metering-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Garde metering B-20b §7.4 — émissions chat/completions instrumentées
        run: python3 scripts/check_metering_sites.py

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gate B-26 — désambiguïsation du catalogue (id unique, collisions qualifiées)
        run: python3 scripts/catalogue_gate.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      - name: Installer eslint
        run: npm install --no-save eslint@9.39.5
      - name: Tests JavaScript
        run: |
          node tests/js/adoption.test.cjs
          node tests/js/chaine_adoption.test.cjs
          node tests/js/engine_filter.test.cjs
      - name: Lint JavaScript ciblé
        run: npx eslint src/forgeai/web/assets/app.js src/forgeai/web/assets/adoption.js src/forgeai/web/assets/engine_filter.js tests/js/*.cjs

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Tests et résumé des warnings — Python ${{ matrix.python-version }}
        if: matrix.python-version != '3.12'
        shell: bash
        run: |
          set +e
          python -m pytest -q -W default -rw 2>&1 | tee pytest-warnings.txt
          statut=${PIPESTATUS[0]}
          {
            echo "## Résumé pytest — Python ${{ matrix.python-version }}"
            echo '```text'
            grep -A 1000 -E 'warnings summary|warnings? in ' pytest-warnings.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$statut"
      - name: Tests, couverture et résumé des warnings — Python 3.12
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set +e
          python -m pytest -q -W default -rw --cov=src/forgeai --cov-report=term --cov-fail-under=85 2>&1 | tee pytest-warnings.txt
          statut=${PIPESTATUS[0]}
          {
            echo "## Résumé pytest — Python 3.12"
            echo '```text'
            grep -A 1000 -E 'warnings summary|warnings? in ' pytest-warnings.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$statut" -ne 0 ]; then
            exit "$statut"
          fi
          coverage report --include="*/forgeai/core/registre.py" --fail-under=95

  tests-os-subset:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Sous-ensemble portable de référence
        run: python -m pytest tests/test_guard_fs.py tests/test_portable_lock.py tests/test_registre_concurrence.py tests/test_openbao_flow_import.py -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reviews-sealed:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 est requis pour calculer le merge-base, le diff origin/main...HEAD
      # et vérifier qu'un reçu archivé pointe vers un commit réellement fusionné (#434).
      # ref: sur pull_request, actions/checkout SANS ref extrait par défaut le commit de
      # MERGE SYNTHÉTIQUE (refs/pull/N/merge), pas le vrai HEAD de la branche — un reçu
      # généré localement contre le vrai HEAD ne correspondrait jamais (revue scellée
      # RC1-004-PR497, DeepSeek-V4-Pro — majeure). Épingle explicitement le SHA réel du
      # commit de tête de PR (merge_group traité en mode archive ci-dessous, pas ici — voir
      # note à l'étape mode PR).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Mode PR limité à pull_request UNIQUEMENT (pas merge_group) : sur merge_group,
      # github.event.merge_group.head_sha est le commit synthétique de TÊTE DE LA QUEUE
      # (peut agréger plusieurs PR), --base-ref origin/main y calculerait un diff plus large
      # que celui qu'une seule PR peut couvrir par son reçu — le gate échouerait à tort sur
      # une merge queue valide (revue scellée RC1-004-PR497-v3, DeepSeek-V4-Pro — critique).
      # merge_group est traité en mode archive : à ce stade la PR est déjà passée par le mode
      # PR, on ne vérifie plus qu'un ancêtre, jamais un diff agrégé.
      - name: Gate D9 — revue liante couvrant le changement de la PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/reviews_gate.py --exiger-recu-courant --base-ref origin/main
      # push est déjà restreint à branches: [main] par le déclencheur `on:` du fichier
      # (ligne 4) — github.event_name == 'push' ne peut donc jamais se déclencher sur une
      # branche de fonctionnalité, aucun filtre github.ref supplémentaire n'est nécessaire
      # ici (vérifié — objection majeure round 3 réfutée, le reviewer ne voyait que le hunk
      # modifié, pas le déclencheur en tête de fichier).
      - name: Gate D9 — archivage des reçus de revues fusionnées
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: python3 scripts/reviews_gate.py --mode archive

  ruff-report:
    # Incrément 1 de #450 (RC1-020) : mesure et rapport SEULEMENT, jamais bloquant sur le nombre
    # de violations — scripts/ruff_report.py retourne toujours 0 sauf panne d'outillage réelle
    # (ruff absent, JSON invalide, classification illisible). Le gate réellement appliqué reste
    # [tool.ruff.lint] select = ["E9", "F"] dans pyproject.toml, inchangé par ce job — job
    # indépendant du reste du fichier, ne touche à aucune ligne existante.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées (inclut ruff épinglé)
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Rapport Ruff — familles candidates, catégorisation défaut/dette/style
        run: python3 scripts/ruff_report.py

  branch-coverage-report:
    # Incrément 1 de #451 (RC1-021) : mesure et rapport SEULEMENT, jamais bloquant sur le nombre
    # de branches manquantes — scripts/branch_coverage_report.py retourne toujours 0 sauf panne
    # d'outillage réelle. Le gate réellement appliqué reste celui du job `tests` (lignes seules,
    # --cov-fail-under=85), inchangé par ce job — mesure de branches en sous-processus SÉPARÉ pour
    # ne jamais interférer avec le calcul de couverture bloquant existant. Job indépendant, ne
    # touche à aucune ligne existante des autres jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Rapport de couverture de branches — par fonction, non bloquant
        run: python3 scripts/branch_coverage_report.py --sortie-json branch-coverage.json
      - name: Conserver le rapport JSON comme artefact CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-coverage-report
          path: branch-coverage.json
          retention-days: 30

  ruff-ratchet:
    # Incrément 2 de #450 (RC1-020) : cliquet BLOQUANT, mais uniquement sur le sous-ensemble de
    # règles déjà classées "defaut_candidat" par governance/ruff-classification.json (dérivé
    # dynamiquement par scripts/ruff_ratchet.py, jamais codé en dur ici). Baseline commitée
    # (governance/ruff-baseline.json) avec dette par fichier ET par (fichier, règle), plus
    # contrôle de non-croissance contre origin/main (fetch-depth: 0 requis, même besoin que
    # mypy-ratchet). [tool.ruff.lint] select reste ["E9", "F"] dans pyproject.toml, inchangé par
    # ce job — job indépendant, ne touche à aucune ligne existante des autres jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées (inclut ruff épinglé)
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Gate RC1-020 — cliquet Ruff (règles defaut_candidat, aucune régression)
        run: |
          python3 scripts/ruff_ratchet.py \
            --racine . \
            --base-ref-git origin/main

  ruff-noqa-gate:
    # Incrément 3b de #450 (RC1-020, dernier) : cliquet BLOQUANT séparé et indépendant sur les
    # suppressions `# noqa: <code>` des mêmes règles "defaut_candidat" — toute suppression doit
    # porter une justification ET une date de révision LOCALEMENT dans le commentaire (format
    # `(révision: YYYY-MM-DD)`). N'invoque jamais ruff (lecture directe du code source) : aucune
    # dépendance tierce, aucune installation de paquet nécessaire ici, contrairement à ruff-ratchet.
    # fetch-depth: 0 requis, même besoin que ruff-ratchet/mypy-ratchet (comparaison git).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Gate RC1-020 — cliquet noqa (justification + date de revision, aucune regression)
        run: |
          python3 scripts/ruff_noqa_gate.py \
            --racine . \
            --base-ref-git origin/main
