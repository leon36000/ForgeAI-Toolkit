name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-stub-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate §8bis — zéro stub, zéro faux
        run: python3 scripts/no_stub_scan.py --all

  registres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intégrité des chaînes de hash
        run: python3 scripts/registre.py verify Registres/*.jsonl

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
