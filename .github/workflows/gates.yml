name: gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-fs-multi-os:
    # Le critere d'arret de l'ADR B-24 (amendement du tour 11) exige que la matrice de
    # comportement de la garde passe sur les TROIS OS supportes. La garde et le verrou
    # portable (ADR #286, fcntl/msvcrt) sont les deux composants du produit dont le
    # comportement depend de l'OS : separateur de chemin et lettres de lecteur Windows
    # pour la garde ; selection de backend flock/LockFile selon os.name pour le verrou.
    # Une preuve Linux seule ne vaut donc rien pour ces composants, alors qu'elle
    # suffit pour le reste du depot — d'ou une matrice ciblee sur ces fichiers de
    # tests plutot qu'un doublement de toute la CI.
    #
    # SECRET-020C etend la matrice a l'IMPORT de src/forgeai/deploy/openbao_flow.py : son
    # import conditionnel de grp (POSIX-only, herite de PORT-286) est un troisieme
    # comportement dependant de l'OS. test_openbao_flow_import.py fait un import PUR (stdlib
    # seul, sans tirer yaml ni la chaine deploy complete de test_openbao_flow.py) et prouve
    # la portabilite reelle sur les trois OS, la ou le mock Linux ne le pouvait pas.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Garde de confinement filesystem — matrice de comportement
        run: python3 -m pytest tests/test_guard_fs.py tests/test_portable_lock.py tests/test_registre_concurrence.py tests/test_openbao_flow_import.py -q
  no-stub-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gate §8bis — zéro stub, zéro faux
        run: python3 scripts/no_stub_scan.py --all

  registres:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 est REQUIS par le gate d'ancrage : la référence anti-rollback est l'état
      # DÉJÀ MERGÉ (origin/main), qu'une PR ne peut pas réécrire. Avec la profondeur 1 par
      # défaut l'historique serait absent et le contrôle échouerait — volontairement, plutôt que
      # de verdir en silence (REG-029B). Même motif que le job gitleaks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Intégrité des chaînes de hash
        run: python3 scripts/registre.py verify Registres/*.jsonl
      # `verify` prouve l'intégrité, jamais l'absence de manque : une chaîne tronquée reste
      # parfaitement valide (ADR-TRUST-019A §2.3, lignes 64-71). L'ancrage compare chaque
      # registre à origin/main et détecte troncature, rollback et réécriture totale cohérente.
      - name: Ancrage — rollback, troncature, réécriture (REG-029B)
        run: python3 scripts/registre.py ancrage --ref origin/main
      # Cliquet de complétude : la dette héritée (31 anomalies, bornées à seq_max) est figée dans
      # une base versionnée ; toute anomalie NOUVELLE fait rougir. La base ne peut pas être
      # élargie pour faire passer une PR : au-delà de la borne, aucune identité n'est baselinable.
      - name: Complétude — cliquet sur la dette héritée (REG-029A/B)
        run: |
          python3 scripts/registre.py completude Registres/*.jsonl \
            --base Registres/BASELINE-COMPLETUDE.json \
            --base-ref-git origin/main
      # governance/vision-log.jsonl (RC1-001/#431) réutilise le même format et les mêmes
      # garanties que Registres/mission.jsonl — même chaîne verify + ancrage, dossier différent.
      - name: Journal de vision (governance) — intégrité + ancrage
        run: |
          python3 scripts/registre.py verify governance/vision-log.jsonl
          python3 scripts/registre.py ancrage --dossier governance --ref origin/main

  authority-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Gate RC1-001 (#431) — hiérarchie d'autorité : inventaire, cycles, conflits, empreintes"
        run: python3 scripts/governance/validate_authority.py

  state-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Gate RC1-007 (#437) — état courant : dérive des compteurs générés"
        run: python3 scripts/governance/state_current.py --docs README.md --docs AGENTS.md

  docs:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 : la non-croissance de la base est vérifiée contre l'état DÉJÀ MERGÉ.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Mesuré avant ce gate : 5 sous-commandes documentées sur 21. Un gate exigeant tout serait
      # rouge au premier jour puis désactivé ; la dette est donc figée dans une base BORNÉE —
      # toute commande ajoutée depuis doit être documentée, jamais baselinée.
      - name: Gate DOC-032 — aucune commande CLI ajoutée sans documentation
        run: |
          python3 scripts/gate_docs.py \
            --base Docs/BASELINE-CLI-DOC.json \
            --base-ref-git origin/main

  metering-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Garde metering B-20b §7.4 — émissions chat/completions instrumentées
        run: python3 scripts/check_metering_sites.py

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gate B-26 — désambiguïsation du catalogue (id unique, collisions qualifiées)
        run: python3 scripts/catalogue_gate.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      - name: Installer eslint
        run: npm install --no-save eslint@9.39.5
      - name: Tests JavaScript
        run: |
          node tests/js/adoption.test.cjs
          node tests/js/chaine_adoption.test.cjs
          node tests/js/engine_filter.test.cjs
      - name: Lint JavaScript ciblé
        run: npx eslint src/forgeai/web/assets/app.js src/forgeai/web/assets/adoption.js src/forgeai/web/assets/engine_filter.js tests/js/*.cjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov pyyaml jsonschema
      - name: Tests + couverture (critères de sortie P1)
        run: |
          pytest -q --cov=src/forgeai --cov-report=term --cov-fail-under=85
          coverage report --include="*/forgeai/core/registre.py" --fail-under=95

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reviews-sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gate D9 — revues aveugles scellées liantes = APPROVE 3/3
        run: python3 scripts/reviews_gate.py
