name: gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-fs-multi-os:
    # Le critere d'arret de l'ADR B-24 (amendement du tour 11) exige que la matrice de
    # comportement de la garde passe sur les TROIS OS supportes. La garde est le seul
    # composant du produit dont le comportement depend de l'OS : separateur de chemin,
    # lettres de lecteur Windows, et retrait du backslash d'echappement (echappement sur
    # POSIX, separateur natif sur Windows). Une preuve Linux seule ne vaut donc rien pour
    # ce composant, alors qu'elle suffit pour le reste du depot — d'ou une matrice ciblee
    # sur ce seul fichier de tests plutot qu'un doublement de toute la CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Garde de confinement filesystem — matrice de comportement
        run: python3 -m pytest tests/test_guard_fs.py -q
  no-stub-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate §8bis — zéro stub, zéro faux
        run: python3 scripts/no_stub_scan.py --all

  registres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intégrité des chaînes de hash
        run: python3 scripts/registre.py verify Registres/*.jsonl

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate B-26 — désambiguïsation du catalogue (id unique, collisions qualifiées)
        run: python3 scripts/catalogue_gate.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov pyyaml
      - name: Tests + couverture (critères de sortie P1)
        run: |
          pytest -q --cov=src/forgeai --cov-report=term --cov-fail-under=85
          coverage report --include="*/forgeai/core/registre.py" --fail-under=95

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reviews-sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate D9 — revues aveugles scellées liantes = APPROVE 3/3
        run: python3 scripts/reviews_gate.py
