name: mise à jour contrôlée des dépendances CI

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  mettre-a-jour-le-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installer uv
        run: python -m pip install uv==0.11.26

      - name: Régénérer le lockfile universel
        # Avec --universal, --python-version 3.10 fixe la borne basse de résolution et uv
        # produit les branches conditionnelles par marker pour toutes les versions de la matrice.
        run: uv pip compile requirements-ci.in --universal --python-version 3.10 --generate-hashes --no-header -o requirements-ci.txt

      - name: Ouvrir une pull request si le lockfile a changé
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- requirements-ci.txt; then
            echo "Le lockfile est déjà à jour."
            exit 0
          fi

          branche="ci/mise-a-jour-requirements-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branche"
          git add requirements-ci.txt
          git commit -m "ci: mettre à jour le lockfile des dépendances de test"
          git push --set-upstream origin "$branche"
          gh pr create \
            --base main \
            --head "$branche" \
            --title "ci: mettre à jour le lockfile des dépendances de test" \
            --body "Mise à jour hebdomadaire contrôlée de requirements-ci.txt générée par uv."
