name: scope-guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  coordination-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Tests du scope guard — comportement réellement exécuté en CI
        run: python -m pytest scripts/coordination/test_scope_guard.py -q
      - name: Valider la coordination multi-IDE (claims, lanes, deps)
        run: python3 scripts/coordination/validate_coordination.py

  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifier que les fichiers modifiés sont dans l'allowlist du claim de CETTE PR
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/coordination/scope_guard.py
