name: scope-guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  coordination-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test verrouillées
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-ci.txt
      - name: Tests du scope guard — comportement réellement exécuté en CI
        run: python -m pytest scripts/coordination/test_scope_guard.py -q
      - name: Valider la coordination multi-IDE (claims, lanes, deps)
        run: python3 scripts/coordination/validate_coordination.py

  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # Sur pull_request, GitHub checkout sinon le merge synthétique refs/pull/*/merge.
          # Le budget doit mesurer la vraie branche pour que `behind` reste honnête.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Vérifier le budget quantitatif puis le périmètre historique éventuel
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: >-
          python3 scripts/coordination/scope_guard.py
          --base-ref "origin/${BASE_BRANCH}"
          --head-ref HEAD

  governance-render-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Régénérer localement les vues de gouvernance sans écrire au dépôt
        run: |
          python3 scripts/governance/classify_paths.py --render
          python3 scripts/governance/state_current.py --render
      - name: Publier les vues exactes comme artefact de correction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-render-${{ github.event.pull_request.number }}
          path: |
            governance/path-classification.json
            governance/PATH-CLASSIFICATION.md
            governance/STATE-CURRENT.json
            governance/STATE-CURRENT.md
          if-no-files-found: error
          retention-days: 1
