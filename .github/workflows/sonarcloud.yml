name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pytest-cov pyyaml

      # `sonar.sources` inclut `scripts`, mais la couverture ne mesurait que src/forgeai et
      # scripts/coordination : TOUT le reste de scripts/ apparaissait donc à 0 % côté SonarCloud,
      # y compris les gates de gouvernance. Portée élargie à `scripts` (audit 2026-08-05).
      # Aucun --cov-fail-under ici : ce run ne sert qu'à produire coverage.xml pour SonarCloud,
      # le seuil bloquant reste celui de gates.yml sur src/forgeai.
      - name: Tests + coverage (XML for SonarCloud)
        run: pytest -q tests scripts/coordination --cov=src/forgeai --cov=scripts --cov-report=xml:coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
