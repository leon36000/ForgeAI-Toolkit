name: Artefact distribué

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-install-outside-checkout:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "0"
      # Round 10 de revue scellée (#454) : force une résolution DÉTERMINISTE
      # du backend PEP 517 dans l'environnement de build ISOLÉ, sans
      # désactiver l'isolation elle-même (vérifié empiriquement : PIP_CONSTRAINT
      # est bien honoré par les installations internes de `python -m build`).
      # Voir requirements-build-constraints.txt pour le détail et la
      # justification de la version épinglée.
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements-build-constraints.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Construire le wheel et le sdist
        run: |
          # L'isolation installe le backend déclaré par pyproject.toml.
          # pyproject_hooks et packaging épinglés explicitement (rounds 8 et 9
          # de revue scellée, #454) : dépendances directes inconditionnelles
          # de build, sinon laissées flottantes (pip installerait la dernière
          # version compatible au moment du run, jamais reproductible pour
          # l'audit supply-chain EXT-029) -- scripts/rapport_composants.py
          # reflète CES pins exacts. packaging==26.3 : même version que
          # requirements-ci.txt (round 9 -- ce job n'installe PAS ce lockfile,
          # donc la version qui y était rapportée n'était vérifiable nulle
          # part ici ; épingler la MÊME version rend les deux cohérents, mais
          # les deux doivent être mis à jour ensemble si l'un bouge).
          python -m pip install --no-cache-dir "build==1.2.2.post1" "pyproject_hooks==1.2.0" "packaging==26.3"
          rm -rf dist
          python -m build --wheel --sdist --outdir dist

      - name: Vérifier les deux artefacts distribués
        run: python scripts/verifier_artefact_distribue.py dist/*.whl dist/*.tar.gz

      - name: Installer chaque artefact et l'exécuter hors checkout
        shell: bash
        run: |
          set -euo pipefail

          verifier_artefact() (
            set -euo pipefail

            artefact="$1"
            travail="$(mktemp -d)"
            pid_web=""

            nettoyer() {
              if [ -n "$pid_web" ]; then
                kill -INT "$pid_web" 2>/dev/null || true
                wait "$pid_web" 2>/dev/null || true
              fi
              rm -rf "$travail"
            }
            trap nettoyer EXIT

            python -m venv "$travail/venv"
            "$travail/venv/bin/python" -m pip install --no-cache-dir "$artefact"

            cd /tmp
            "$travail/venv/bin/forgeai" --help
            "$travail/venv/bin/forgeai" doctor
            "$travail/venv/bin/python" -c '
          import json
          from importlib import resources

          catalogue = resources.files("forgeai.data").joinpath("catalogue.json")
          assert catalogue.is_file(), catalogue
          assert json.loads(catalogue.read_text(encoding="utf-8")) is not None
            '

            "$travail/venv/bin/forgeai" web --host 127.0.0.1 --port 8765 >"$travail/web.log" 2>&1 &
            pid_web=$!

            python3 -c '
          import time
          from urllib.request import urlopen

          for _ in range(50):
              try:
                  with urlopen("http://127.0.0.1:8765/", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("La web-app installee ne repond pas ; consultez le journal.")
            '

            kill -INT "$pid_web"
            # Attend la terminaison propre avec un délai borné (10s) : un thread de requête
            # non-daemon resté actif après une exception intermittente côté serveur (ex.
            # BrokenPipeError si le client ferme la connexion avant la fin de l'écriture de
            # la réponse) peut empêcher l'interpréteur Python de se terminer malgré
            # server.shutdown()/server.server_close() — mesuré : sans ce garde-fou, ce gate a
            # bloqué 6h avant l'annulation forcée du job. SIGKILL de secours si nécessaire.
            for _ in $(seq 1 100); do
              kill -0 "$pid_web" 2>/dev/null || break
              sleep 0.1
            done
            kill -0 "$pid_web" 2>/dev/null && kill -9 "$pid_web" 2>/dev/null
            statut=0
            wait "$pid_web" || statut=$?
            pid_web=""
            # 0/130 : arrêt normal (KeyboardInterrupt géré, cf. serve()) ; 137 : SIGKILL de
            # secours ci-dessus ; 134 : SIGABRT auto-déclenché par l'interpréteur lui-même
            # (reproduit empiriquement : "Fatal Python error: _enter_buffered_busy ... at
            # interpreter shutdown, possibly due to daemon threads" — condition de course
            # connue de la stdlib entre un thread de requête en train d'écrire sur stderr et
            # la finalisation de l'interpréteur après server.shutdown(), intermittente,
            # aucun rapport avec le contenu de la réponse HTTP elle-même).
            test "$statut" -eq 0 -o "$statut" -eq 130 -o "$statut" -eq 134 -o "$statut" -eq 137

            "$travail/venv/bin/python" -m pip uninstall --yes forgeai-toolkit
            "$travail/venv/bin/python" -c '
          import importlib.util
          import site
          from pathlib import Path

          assert importlib.util.find_spec("forgeai") is None
          restes = []
          for dossier in site.getsitepackages():
              for chemin in Path(dossier).iterdir():
                  if chemin.name.lower().startswith(("forgeai", "forgeai_toolkit")):
                      restes.append(str(chemin))
          assert not restes, "Fichiers ForgeAI restants dans site-packages : " + ", ".join(restes)
            '
          )

          verifier_artefact "$GITHUB_WORKSPACE"/dist/*.whl
          verifier_artefact "$GITHUB_WORKSPACE"/dist/*.tar.gz

      - name: Double construction reproductible et comparaison détaillée
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-premier dist-second
          python -m build --wheel --sdist --outdir dist-premier
          python -m build --wheel --sdist --outdir dist-second
          python3 -c '
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          def members(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      return {
                          name: archive.read(name)
                          for name in archive.namelist()
                          if not name.endswith("/")
                      }
              with tarfile.open(path, "r:gz") as archive:
                  result = {}
                  for member in archive.getmembers():
                      if member.isfile():
                          stream = archive.extractfile(member)
                          result[member.name] = stream.read() if stream else b""
                  return result

          premier = Path("dist-premier")
          second = Path("dist-second")
          erreurs = []
          for artefact in sorted(premier.iterdir()):
              correspondant = second / artefact.name
              if not correspondant.is_file():
                  erreurs.append(f"Artefact absent de la seconde construction : {correspondant}")
                  continue
              # Décision basée sur le CONTENU logique (membres(), noms+bytes des fichiers dans
              # l archive), jamais sur le hash brut du fichier archive entier : le format tar.gz
              # du sdist n honore pas SOURCE_DATE_EPOCH pour les métadonnées internes (mtime des
              # répertoires et de PKG-INFO/setup.cfg générés à la volée, vérifié empiriquement —
              # le wheel/zip, lui, est byte-identique) — un hash brut produirait donc un faux
              # négatif systématique sur le sdist malgré un contenu réellement identique.
              membres_a = members(artefact)
              membres_b = members(correspondant)
              if membres_a == membres_b:
                  continue
              erreurs.append(f"Contenu différent pour {artefact.name} :")
              for nom in sorted(set(membres_a) | set(membres_b)):
                  if membres_a.get(nom) != membres_b.get(nom):
                      erreurs.append(f"  membre différent : {nom}")

          for artefact in sorted(second.iterdir()):
              if not (premier / artefact.name).is_file():
                  erreurs.append(f"Artefact absent de la première construction : {artefact}")

          if erreurs:
              print("\n".join(erreurs), file=sys.stderr)
              raise SystemExit(1)
          '

      - name: Produire les empreintes des artefacts publiés
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Publier les artefacts et leurs empreintes
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: forgeai-toolkit-distribution
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
