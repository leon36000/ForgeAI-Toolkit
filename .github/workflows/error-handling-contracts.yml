name: Error handling contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valider les contrats de gestion d'erreurs
        run: python scripts/governance/validate_error_contracts.py --root .

      - name: Vérifier que le rapport Markdown est synchronisé avec le JSON
        run: |
          set -euo pipefail
          python scripts/governance/validate_error_contracts.py --root . --render
          git diff --exit-code -- governance/ERROR-HANDLING-CONTRACTS.md

      - name: Détecter un décalage de site non répercuté
        shell: bash
        run: |
          set -euo pipefail
          travail="$(mktemp -d)"
          trap 'rm -rf "$travail"' EXIT
          cp -a . "$travail/repo"
          cd "$travail/repo"

          sed -i '1i# mutation décalage de ligne' src/forgeai/core/proc.py

          python -m py_compile src/forgeai/core/proc.py

          set +e
          sortie="$(python scripts/governance/validate_error_contracts.py --root . 2>&1)"
          statut=$?
          set -e

          test "$statut" -ne 0
          printf '%s\n' "$sortie" | grep -F "site introuvable"

  export-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/export-source-e81b16e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archiver le tree Git exact
        shell: bash
        run: git archive --format=tar.gz --output="forgeai-source-${GITHUB_SHA}.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-snapshot-${{ github.event.pull_request.head.sha }}
          path: forgeai-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
